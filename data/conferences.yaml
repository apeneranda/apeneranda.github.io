# Conférences et interventions filmées ou enregistrées.
# Une entrée par intervention, introduite par un tiret ; l'ordre est libre (tri par date).
# La page « Conférences et interventions » les affiche toutes ; l'accueil n'affiche que
# celles qui portent « accueil: true ».
#
#   date      : jour de l'intervention, au format AAAA-MM-JJ
#   youtube   : identifiant de la vidéo (ce qui suit « v= » ou « /live/ » dans l'adresse)
#   debut     : seconde où commence l'intervention (le « t= » de l'adresse) — facultatif ;
#               hors YouTube, la laisser aussi dans l'adresse « integration » (…?t=6780)
#   url       : adresse d'un enregistrement hébergé ailleurs (Canal-U, audio…) — à la place de « youtube » ;
#               indiquer alors « hebergeur » dans les blocs fr et en (« Voir la vidéo sur … »)
#   integration : adresse du lecteur d'un autre hébergeur, c'est-à-dire ce qui suit « src= » dans le code
#               d'intégration du site (bouton « Intégrer » ou « Partager ») — en complément de « url »
#   vignette  : image 16:9 affichée avant la lecture, déposée dans assets/img/ — facultative avec « url »
#   affiche   : affiche ou image du colloque, déposée dans assets/img/ — facultatif
#   liens     : liens complémentaires (programme, page du colloque, affiche en PDF…) : pour chacun,
#               « url » puis le libellé dans chaque langue (« fr », « en ») — facultatif
#   accueil   : true pour afficher aussi l'intervention sur la page d'accueil — facultatif
#   fr / en   : evenement, lieu (facultatif), titre, description dans chaque langue

