baseURL = "https://apeneranda.github.io/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = "Adrien Peneranda"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  # Clés BibTeX des publications mises en avant en tête de la page Publications
  featured = ["peneranda2025marcel", "amabile2018management", "peneranda2017aristote"]

# Anglais (langue par défaut) : à la racine du site (https://apeneranda.github.io/)
[languages.en]
  weight = 1
  label = "English"
  locale = "en-GB"
  [languages.en.params]
    description = "Adrien Peneranda, Associate Professor of Management at Sciences Po Toulouse (LEREPS): public management, information systems, philosophy of management."
    cv = "/files/cv-en.pdf"
  [[languages.en.menus.main]]
    name = "Bio"
    pageRef = "/bio"
    weight = 10
  [[languages.en.menus.main]]
    name = "Publications"
    pageRef = "/publications"
    weight = 20
  [[languages.en.menus.main]]
    name = "Teaching"
    pageRef = "/enseignement"
    weight = 30
  [[languages.en.menus.main]]
    name = "CV"
    url = "/files/cv-en.pdf"
    weight = 40
  [[languages.en.menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50

# Français : sous /fr/ (https://apeneranda.github.io/fr/)
[languages.fr]
  weight = 2
  label = "Français"
  locale = "fr-FR"
  [languages.fr.params]
    description = "Adrien Peneranda, maître de conférences en sciences de gestion à Sciences Po Toulouse (LEREPS) : management public, systèmes d'information, philosophie des sciences de gestion."
    cv = "/files/cv.pdf"
  [[languages.fr.menus.main]]
    name = "Bio"
    pageRef = "/bio"
    weight = 10
  [[languages.fr.menus.main]]
    name = "Publications"
    pageRef = "/publications"
    weight = 20
  [[languages.fr.menus.main]]
    name = "Enseignement"
    pageRef = "/enseignement"
    weight = 30
  [[languages.fr.menus.main]]
    name = "CV"
    url = "/files/cv.pdf"
    weight = 40
  [[languages.fr.menus.main]]
    name = "Contact"
    pageRef = "/contact"
    weight = 50

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.typographer]
  disable = true

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.x]
    disable = true
  [privacy.youtube]
    disable = true
