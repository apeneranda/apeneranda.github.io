{{ define "main" }}
{{ $c := hugo.Data.profil.contact }}
<article class="container page">
  <h1>{{ .Title }}</h1>
  <ul class="contact-list">
    <li>
      <span class="contact-icon">{{ partial "icone.html" "email" }}</span>
      <a href="mailto:{{ $c.email }}">{{ $c.email }}</a>
    </li>
    <li>
      <span class="contact-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 21s7-6.2 7-11.5a7 7 0 1 0-14 0C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></span>
      <address>
        {{ range $c.adresse }}{{ . }}<br>{{ end }}
        {{ $c.bureau }}
      </address>
    </li>
    <li>
      <span class="contact-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="m3 6 6-2.5 6 2.5 6-2.5v14.5L15 20.5 9 18l-6 2.5zM9 3.5V18M15 6v14.5"/></svg></span>
      <a href="{{ $c.carte }}">Voir sur la carte (OpenStreetMap)</a>
    </li>
  </ul>
  {{ .Content }}
</article>
{{ end }}
